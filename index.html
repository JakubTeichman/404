<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 Empatia not found</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #000;
      --text: #cfcfcf;
      --accent: #6af;
    }
    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: 'VT323', monospace;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .center{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-align:center;
      gap:18px;
      padding:32px;
      box-sizing:border-box;
    }
    h1{
      font-size:clamp(28px,8vw,88px);
      letter-spacing:2px;
      margin:0;
      line-height:0.9;
      color:var(--text);
      text-transform:uppercase;
    }
    .error-code{
      font-size:clamp(44px,12vw,132px);
      color:var(--accent);
      text-shadow:
        0 0 6px rgba(106,170,255,0.06),
        0 2px 0 rgba(0,0,0,0.6);
      margin:0;
    }
    .meta{
      font-size:clamp(12px,2.4vw,18px);
      opacity:0.9;
      margin-top:6px;
    }
    .box{
      backdrop-filter: blur(0.5px);
      padding:28px 40px;
      border-radius:12px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.7);
      border:1px solid rgba(255,255,255,0.03);
    }
    /* subtle scanline effect */
    .scanlines::before{
      content: "";
      position: absolute;
      inset:0;
      background-image: linear-gradient(rgba(255,255,255,0.01) 50%, rgba(0,0,0,0.03) 50%);
      background-size: 100% 4px;
      pointer-events:none;
      mix-blend-mode:overlay;
    }
    .small{
      font-size:12px;
      opacity:0.6;
      margin-top:10px;
    }
    /* responsive tweak */
    @media (max-width:420px){
      .box{ padding:20px; }
    }
  </style>
</head>
<body>
  <main class="center">
    <div style="position:relative" class="box scanlines" role="main" aria-labelledby="errortitle">
      <p class="error-code" aria-hidden="true">404</p>
      <h1 id="errortitle">Empatia not found</h1>
      <div class="meta">10.10.2026 — 10:00</div>
      <div class="small">System message: brak odpowiedzi emocjonalnej — spróbuj ponownie później.</div>
    </div>
  </main>
</body>
</html>
